name: Bug report
description: Report reproducible AeroDNS behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
        - label: This report does not contain private DNS history, credentials, or signing material.
          required: true
  - type: input
    attributes:
      label: AeroDNS version
      placeholder: "1.5.2"
    validations:
      required: true
  - type: input
    attributes:
      label: Android version and device
      description: Include the Android version, device model and manufacturer OS version, if known.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: DNS protocol
      options:
        - Standard DNS
        - DNS-over-HTTPS
        - Not sure
    validations:
      required: true
  - type: textarea
    attributes:
      label: Network and VPN settings
      description: Include Wi-Fi or mobile, Android Private DNS, Always-on VPN, and Block connections without VPN. Omit private resolver addresses or URLs.
  - type: dropdown
    attributes:
      label: Installation source
      options:
        - Google Play
        - Built from source
        - Other
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
