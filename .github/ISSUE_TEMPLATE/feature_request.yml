name: Feature request
description: Propose a focused improvement to AeroDNS.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
  - type: textarea
    attributes:
      label: Security and privacy impact
      description: Describe any changes to VPN routing, DNS transport, stored data, or network trust.
